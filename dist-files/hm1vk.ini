; hm1vk - DirectDraw 7 / Direct3D 7 on Vulkan, for HitMan-Rust.exe
[hm1vk]
; Wait for vertical blank when presenting (1/0)
VSync = 1

; Frame-rate cap, 0 = none. The engine was designed for <= 60 fps.
FpsLimit = 0

; 1 = change the desktop resolution for fullscreen modes (like real DirectDraw).
; 0 = keep the desktop resolution and scale the game image.
ChangeDisplayMode = 1

; Force anisotropic filtering on linear-filtered textures (0 = as the game asks, 2..16)
Anisotropy = 0

; Largest display mode offered to the game
MaxWidth = 3840
MaxHeight = 2160

; Modes always offered even if the monitor does not list them (scaled)
ExtraModes = 1280x720, 1920x1080, 2560x1440, 3840x2160

; Use the exact Resolution from the game .ini. The original renderer only
; supports 4:3 modes up to 1600x1200; this enables 16:9 and up to 3840x2160.
FixResolution = 1

; Scale of the game's 2D interface: menus, laptop briefing, in-game HUD and
; subtitles. 1x (or 100%) = normal size, 2x (200%), 3x (300%). Menus are
; zoomed about the screen centre (limited so the menu still fits on screen);
; HUD elements grow from the screen edge or corner they sit at.
UIZoom = 2x

; Run key works with every direction, like a modern shooter: Shift+W runs
; forwards, Shift+S runs backwards, add A/D to run diagonally; Shift alone
; does nothing. 0 = original controls (Shift alone runs forwards, Shift+S
; walks backwards). The game has no sideways run, so Shift+A/D strafes at
; walking speed. Key bindings from the game's options are respected.
ModernRun = 1

; Horizontal field of view of the gameplay camera, in degrees. 67.4 is the
; game's own FOV; allowed range 57.4 (10 narrower) to 87.4 (20 wider).
; Cutscenes, the sniper scope and binoculars keep their own FOV. Wide values
; can show unfinished level edges and clip Hitman's shoulders when the camera
; is close behind him.
FOV = 67.4

; Offer 16-bit modes as well as 32-bit
Modes16Bit = 1

; Vulkan validation layer (needs the Vulkan SDK)
Validation = 0

; 0 = info, 1 = debug, 2 = trace (log file: HitManVK\hm1vk.log)
LogLevel = 0
